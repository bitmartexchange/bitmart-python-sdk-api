[metadata]
description-file = README.md

[tool:pytest]
log_cli = true
log_cli_level = DEBUG
log_cli_format = %(asctime)s.%(msecs)03d UTC %(levelname)s %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

[flake8]
exclude =
    .git,
    .tox,
    build,
    dist
max-complexity = 10
ignore = E501, W503, W504
